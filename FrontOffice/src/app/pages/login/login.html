<div class="row justify-content-center align-items-center g-4">
  <div class="col-lg-5">
    <div class="card border-0 soft-shadow rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="fs-1 mb-2 text-dark">
            <i class="bi bi-box-arrow-in-right"></i>
          </div>
          <h1 class="h3 fw-bold mb-1">Welcome back</h1>
          <p class="text-muted mb-0">
            Login to continue shopping
          </p>
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="login()">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">
              Email
            </label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-control form-control-lg"
              [(ngModel)]="email"
              placeholder="client@test.com"
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control form-control-lg"
              [(ngModel)]="password"
              placeholder="Password"
            />
          </div>

          <button type="submit" class="btn btn-dark btn-lg w-100" [disabled]="loading">
            <span class="spinner-border spinner-border-sm me-2" *ngIf="loading"></span>
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>
        </form>

        <p class="mt-4 mb-0 text-center text-muted">
          Don’t have an account?
          <a routerLink="/register">Create account</a>
        </p>
      </div>
    </div>
  </div>

  <div class="col-lg-5 d-none d-lg-block">
    <div class="card border-0 bg-dark text-white rounded-4 soft-shadow">
      <div class="card-body p-5">
        <h2 class="fw-bold mb-3">Shop smarter</h2>
        <p class="text-white-50 mb-4">
          Access your local marketplace, compare prices and manage your online grocery orders.
        </p>

        <div class="d-flex flex-column gap-3">
          <div>
            <i class="bi bi-check-circle-fill me-2 text-success"></i>
            Compare supermarket prices
          </div>
          <div>
            <i class="bi bi-check-circle-fill me-2 text-success"></i>
            View your orders and dashboard
          </div>
          <div>
            <i class="bi bi-check-circle-fill me-2 text-success"></i>
            Fast and simple ordering flow
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
