<div class="row justify-content-center align-items-center g-4">
  <div class="col-lg-7">
    <div class="card border-0 soft-shadow rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="fs-1 mb-2 text-dark">
            <i class="bi bi-person-plus"></i>
          </div>
          <h1 class="h3 fw-bold mb-1">Create your account</h1>
          <p class="text-muted mb-0">
            Join the local supermarket marketplace
          </p>
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="register()">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label fw-semibold">
                Name
              </label>
              <input
                id="name"
                name="name"
                type="text"
                class="form-control form-control-lg"
                [(ngModel)]="registerData.name"
              />
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label fw-semibold">
                Phone
              </label>
              <input
                id="phone"
                name="phone"
                type="text"
                class="form-control form-control-lg"
                [(ngModel)]="registerData.phone"
              />
            </div>

            <div class="col-12">
              <label for="email" class="form-label fw-semibold">
                Email
              </label>
              <input
                id="email"
                name="email"
                type="email"
                class="form-control form-control-lg"
                [(ngModel)]="registerData.email"
              />
            </div>

            <div class="col-12">
              <label for="address" class="form-label fw-semibold">
                Address
              </label>
              <input
                id="address"
                name="address"
                type="text"
                class="form-control form-control-lg"
                [(ngModel)]="registerData.address"
              />
            </div>

            <div class="col-12">
              <label for="password" class="form-label fw-semibold">
                Password
              </label>
              <input
                id="password"
                name="password"
                type="password"
                class="form-control form-control-lg"
                [(ngModel)]="registerData.password"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-dark btn-lg w-100 mt-4" [disabled]="loading">
            <span class="spinner-border spinner-border-sm me-2" *ngIf="loading"></span>
            {{ loading ? 'Creating account...' : 'Create account' }}
          </button>
        </form>

        <p class="mt-4 mb-0 text-center text-muted">
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
