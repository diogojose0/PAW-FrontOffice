<section class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 soft-shadow rounded-4">
      <div class="card-body text-center p-5">
        <div class="display-4 mb-3 text-success">
          <i class="bi bi-credit-card"></i>
        </div>

        <h1 class="h2 fw-bold mb-3">Stripe payment</h1>

        <div class="text-center py-3" *ngIf="loading">
          <div class="spinner-border text-dark"></div>
          <p class="text-muted mt-3 mb-0">Confirming payment...</p>
        </div>

        <div class="alert alert-success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div *ngIf="order">
          <p class="text-muted mb-1">
            Order #{{ order._id.slice(-6) }}
          </p>

          <div class="display-6 fw-bold text-success mb-2">
            {{ order.finalTotal | number: '1.2-2' }} €
          </div>

          <p class="text-muted mb-4">
            Payment status:
            <strong>{{ order.paymentStatus }}</strong>
          </p>

          <a class="btn btn-dark" [routerLink]="['/orders', order._id]">
            View order details
          </a>
        </div>

        <a class="btn btn-outline-secondary mt-3" routerLink="/orders" *ngIf="!order && !loading">
          Back to orders
        </a>
      </div>
    </div>
  </div>
</section>
