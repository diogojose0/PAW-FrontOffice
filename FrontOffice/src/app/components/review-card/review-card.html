<article class="review-card rounded-4 border bg-white" [class.review-card-compact]="compact">
  <div class="d-flex justify-content-between align-items-start gap-3">
    <div>
      <div class="fw-semibold">
        {{ getReviewerName() }}
      </div>

      <div class="text-warning small">
        {{ getStarText() }}
      </div>
    </div>

    <span class="text-muted small flex-shrink-0">
      {{ review.createdAt | date: 'shortDate' }}
    </span>
  </div>

  <p class="text-muted mb-0 mt-2" *ngIf="review.supermarketComment; else noComment">
    {{ review.supermarketComment }}
  </p>

  <ng-template #noComment>
    <p class="text-muted fst-italic mb-0 mt-2">No comment provided.</p>
  </ng-template>
</article>
