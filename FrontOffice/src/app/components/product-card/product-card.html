<div class="card h-100 border-0 soft-shadow rounded-4 overflow-hidden">
  <div class="ratio ratio-16x9 bg-light">
    <img
      *ngIf="product.imageUrl"
      [src]="getProductImageUrl()"
      class="w-100 h-100 object-fit-cover"
      [alt]="product.name"
    />

    <div
      *ngIf="!product.imageUrl"
      class="d-flex align-items-center justify-content-center text-muted"
    >
      No image
    </div>
  </div>

  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h2 class="h5 fw-bold mb-1">
          {{ product.name }}
        </h2>

        <span class="badge text-bg-light border">
          {{ product.categoryId.name }}
        </span>
      </div>

      <div class="text-end flex-shrink-0">
        <div class="text-muted small">Price</div>

        <div class="fs-3 fw-bold text-success lh-1">
          {{ product.price | number: '1.2-2' }} €
        </div>
      </div>
    </div>

    <p class="text-muted small mb-3">
      {{ product.description }}
    </p>

    <div class="mb-3">
      <span class="badge text-bg-warning" *ngIf="product.stock > 0">
        Stock: {{ product.stock }}
      </span>

      <span class="badge text-bg-secondary" *ngIf="product.stock <= 0">
        Out of stock
      </span>
    </div>

    <div class="mt-auto">
      <ng-container *ngIf="showSupermarketInfo">
        <p class="small text-muted mb-1">
          <i class="bi bi-shop me-1"></i>
          {{ getProductSupermarketName() }}
        </p>

        <p class="small text-muted mb-3">
          <i class="bi bi-geo-alt me-1"></i>
          {{ getProductSupermarketLocation() }}
        </p>
      </ng-container>

      <button
        type="button"
        class="btn btn-outline-dark w-100"
        (click)="onAddToCart()"
        [disabled]="product.stock <= 0"
      >
        <i class="bi bi-cart-plus me-1"></i>
        {{ product.stock > 0 ? 'Add to cart' : 'Out of stock' }}
      </button>
    </div>
  </div>
</div>
